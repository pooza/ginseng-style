name: test
on:
  push:
  # ⚠ push 契機だけだと、更新が止まった gem は永遠に緑のままになる。
  schedule:
    - cron: '25 0 * * 1'
  # ⚠ schedule: は 60 日の無活動で GitHub に無効化される。gem-watch から起こせる
  # ようにしておく（docs/workflow.md の「⚠⚠ 週次 schedule は勝手に止まる」参照）。
  workflow_dispatch:
# ⚠⚠ 手順本体は pooza/ginseng-style の composite action を @main で参照している。
# そこに入った変更が、このリポジトリの GITHUB_TOKEN を持って動く。既定に頼らず絞る。
permissions:
  contents: read
env:
  CI: 'true'
jobs:
  test:
    runs-on: ubuntu-latest
    container: ${{ matrix.ruby }}
    strategy:
      matrix:
        ruby:
          - ruby:3.3
          - ruby:3.4
          - ruby:4.0
    steps:
      - uses: actions/checkout@v5
        with:
          # ⚠ 既定では認証情報がワークツリーの git config に残る。後続のステップから
          # 使えてしまうので消す。依存 gem は public な github: 参照なので影響しない。
          persist-credentials: false

      # 🔴 **説明文に式を書くと action の読み込みが失敗する (#70)。**
      # ⚠⚠ YAML としては妥当なので Psych も rubocop も通り、**release.yml は main への
      # push でしか動かない**ので、マージするまで分からなかった。ここで止める。
      - name: check action metadata
        shell: bash
        run: |
          set -euo pipefail
          # ⚠ この workflow 自身が評価されないよう、パターンは組み立てる。
          pattern=$(printf '\x24{{')
          bad=0
          for f in .github/actions/*/action.yml; do
            if sed -n '1,/^runs:/p' "$f" | grep -Fn "$pattern"; then
              echo "::error file=$f::runs: より前に式がある。説明文でも評価され、action の読み込みが失敗する (#70)"
              bad=1
            fi
          done
          exit $bad
      - uses: ./.github/actions/ruby-check
        with:
          # ⚠ この gem は設定と docs を配るだけで、ライブラリの実装を持たない。
          # bundle:check は Ginseng::Environment に依存するが、ginseng-core に
          # 依存させると循環するので実行しない。テストも持たない。
          bundle-check: 'false'
          test: 'false'
