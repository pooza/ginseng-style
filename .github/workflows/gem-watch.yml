name: gem-watch

# ⚠⚠ public リポジトリの schedule: は 60 日間リポジトリ活動が無いと GitHub が
# 自動で無効化する。⚠ 「活動」の定義は文書化されていないので、定義に依存する
# keepalive では守れない。ここでは 2 つを分けて解く。
#   1. 無効化の検知 — state が active でなければ落とす（disabled_inactivity は API の値）
#   2. 実行の担保   — 各 gem の schedule: に頼らず workflow_dispatch で起こす
# ⚠ この workflow 自身が 60 日で止まる可能性は残る。ginseng-style は管理拠点で
#   活動が続く前提。詳細は docs/workflow.md。

on:
  schedule:
    # ⚠ 各 gem の test（月曜 00:25 UTC）より後に置く
    - cron: '25 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  GEMS: >-
    ginseng-style
    ginseng-core
    ginseng-fediverse
    ginseng-web
    ginseng-redis
    ginseng-postgres
    ginseng-piefed
    ginseng-youtube

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: check workflow states
        env:
          GH_TOKEN: ${{ secrets.GEM_WATCH_TOKEN }}
        run: |
          set -uo pipefail
          bad=0
          for r in $GEMS; do
            if ! gh api "repos/pooza/$r/actions/workflows" \
                --jq '.workflows[] | "\(.state)\t\(.name)\t\(.path)"' > states.tsv; then
              echo "::error::pooza/$r の workflow 一覧を取得できない"
              bad=1
              continue
            fi
            while IFS=$'\t' read -r state name path; do
              if [ "$state" = active ]; then
                echo "ok       pooza/$r  $name"
              else
                echo "::error::pooza/$r $name ($path) = $state"
                bad=1
              fi
            done < states.tsv
          done
          exit $bad

      # ⚠ 状態が赤でも起動は試みる。無効化されていない gem のテストまで止めない。
      # ⚠⚠ always() ではなく !cancelled()。always() はキャンセル時も true を返すので、
      # 中止しても 8 リポジトリへの dispatch が走ってしまう。
      - name: dispatch tests
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GEM_WATCH_TOKEN }}
        run: |
          set -uo pipefail
          bad=0
          for r in $GEMS; do
            if gh workflow run test.yml -R "pooza/$r"; then
              echo "dispatched  pooza/$r"
            else
              # ⚠⚠ 起動できなければ「実行の担保」が成立していない。残りは続けるが、
              # 最後に必ず落とす。warning にすると全部失敗しても緑のままになる。
              echo "::error::pooza/$r の test.yml を起動できない（workflow_dispatch: が無い / トークンの権限不足）"
              bad=1
            fi
          done
          exit $bad

  # ⚠⚠ #53 で利用側を `tag:` 固定にした。固定は「勝手に赤くなる」を止める代わりに
  # 「**いつまでも古いまま**」を招く。⚠ これは仮定ではない — `ginseng-core` は
  # 最後のタグが 2026-06-10 で止まったまま 88 コミット進んでいる。固定した以上、
  # 陳腐化は**別途見張らないと誰も気付かない**。
  pins:
    runs-on: ubuntu-latest
    steps:
      - name: check pinned ginseng-style
        env:
          GH_TOKEN: ${{ secrets.GEM_WATCH_TOKEN }}
        run: |
          set -uo pipefail

          # ⚠⚠ タグは付け替えられる。**書き込みトークンを渡す release-tag を動く ref で
          # 刺すのは危ない**（#75）。参照は SHA で固定し、ここで「その SHA が実在の
          # タグを指しているか」まで確かめる。
          # ⚠ **コメントの `# vX.Y.Z` は信用しない。** SHA からタグを引いて突き合わせる。
          tags=$(gh api repos/pooza/ginseng-style/tags --paginate --jq '.[] | "\(.commit.sha) \(.name)"')
          if [ -z "$tags" ]; then
            echo "::error::pooza/ginseng-style にタグが無い。release.yml が動いていない"
            exit 1
          fi
          semver=$(printf '%s\n' "$tags" | awk '$2 ~ /^v[0-9]+\.[0-9]+\.[0-9]+$/')
          latest=$(printf '%s\n' "$semver" | awk '{print $2}' | sort -V | tail -1)
          latest_sha=$(printf '%s\n' "$semver" | awk -v t="$latest" '$2 == t {print $1; exit}')
          if [ -z "$latest_sha" ]; then
            echo "::error::最新タグ $latest の SHA を引けない"
            exit 1
          fi
          echo "最新 = $latest ($latest_sha)"

          raw() { gh api -H 'Accept: application/vnd.github.raw' "repos/pooza/$1/contents/$2" 2>/dev/null; }

          # SHA が指しているタグ名を返す（無ければ空）。
          tag_of() { printf '%s\n' "$semver" | awk -v s="$1" '$1 == s {print $2; exit}'; }

          is_sha() { printf '%s' "$1" | grep -Eq '^[0-9a-f]{40}$'; }
          is_tag() { printf '%s' "$1" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; }

          # ⚠⚠ 判定はここ 1 箇所。3 経路で同じ規則を使う。
          #   SHA でタグを指している        → ok / 古ければ warning
          #   SHA だがタグが無い            → 🔴 error（レビューを通っていないコミット）
          #   vX.Y.Z                        → ⚠ warning（SHA へ移行中。#75。移行後 error へ上げる）
          #   それ以外（@main / 空）        → error
          check_ref() {
            where=$1
            ref=$2
            if [ -z "$ref" ]; then
              echo "::error::$where が ginseng-style を参照していない"
              return 1
            fi
            if is_sha "$ref"; then
              t=$(tag_of "$ref")
              if [ -z "$t" ]; then
                echo "::error::$where が @${ref} を刺しているが、この SHA に対応するタグが無い"
                return 1
              fi
              if [ "$ref" != "$latest_sha" ]; then
                echo "::warning::$where は @${ref}（$t。最新は $latest）"
                stale=$((stale + 1))
              fi
              return 0
            fi
            if is_tag "$ref"; then
              # ⚠ 落とさない。**移行の最中は必ずタグのままの期間がある**。
              #   ここで赤くすると「赤は無視するもの」になる。配り切ったら error へ上げる。
              echo "::warning::$where が @${ref}（タグ）で固定している。SHA へ移行すること（#75）"
              stale=$((stale + 1))
              return 0
            fi
            # ⚠ @main / @develop / 任意のブランチ。どれも固定されていない。
            echo "::error::$where が @${ref} を参照している（SHA ではない）"
            return 1
          }

          bad=0
          stale=0
          for r in $GEMS; do
            [ "$r" = ginseng-style ] && continue

            # ① Gemfile 側（設定そのもの）。⚠ SHA なら `ref:`、タグなら `tag:`。
            # ⚠⚠ **`gem` の宣言は複数行にまたがる**（Layout/LineLength の Max: 100 が
            #   あるので、SHA を書くと 1 行に収まらない）。⚠ 1 行しか見ない実装だと、
            #   **README がすすめている書き方がそのまま「参照していない」に化ける**（Codex P2）。
            #   `gem 'ginseng-style'` の行から、末尾がカンマでない行までを 1 本に畳む。
            # ⚠ `branch:` も拾う。拾わないと未固定を「参照していない」と誤診する。
            gemfile=$(raw "$r" Gemfile)
            ref=$(printf '%s' "$gemfile" \
                    | awk '/gem +.?ginseng-style.?,/ { f = 1 }
                           f { buf = buf " " $0; if ($0 !~ /,[[:space:]]*$/) { print buf; exit } }' \
                    | sed -n "s/.*\(ref\|tag\|branch\): *['\"]\([^'\"]*\)['\"].*/\2/p" | head -1)
            check_ref "pooza/$r の Gemfile" "$ref" || bad=1

            # ② test.yml 側（共有 composite action。#32）
            ref=$(raw "$r" .github/workflows/test.yml \
                    | sed -n 's|.*pooza/ginseng-style/.github/actions/ruby-check@\([0-9a-zA-Z._-]*\).*|\1|p' | head -1)
            check_ref "pooza/$r の test.yml の ruby-check" "$ref" || bad=1

            # ③ release.yml 側（タグを打つ composite action。#65）
            # ⚠⚠ **「取れなかった」を「無い」と読まないこと（Codex P2）。** `raw` は
            # 診断を握り潰すうえ、`pins` は `-e` を有効にしていないので、認証・レート
            # 制限・ネットワークの失敗がそのまま見逃してよい側へ倒れる。
            # ⚠ **404 だけを「無い」として扱う。**
            release_url="repos/pooza/$r/contents/.github/workflows/release.yml"
            release_ok=no
            if release=$(gh api -H 'Accept: application/vnd.github.raw' "$release_url" 2>&1); then
              release_ok=yes
            elif printf '%s' "$release" | grep -q '(HTTP 404)'; then
              # ⚠⚠ 2026-08-27 に 8/8 へ配り終えたので error に上げた（#65）。
              # ここから先の「無い」は配布の途中ではなく**消えた**ということで、
              # そのリポジトリは**タグが永久に打たれない**状態になる。
              echo "::error::pooza/$r に release.yml が無い。タグが打たれない（#65 で 8/8 に配布済み）"
              bad=1
            else
              echo "::error::pooza/$r の release.yml を取得できない: $(printf '%s' "$release" | head -1)"
              bad=1
            fi

            if [ "$release_ok" = yes ]; then
              ref=$(printf '%s' "$release" \
                      | sed -n 's|.*pooza/ginseng-style/.github/actions/release-tag@\([0-9a-zA-Z._-]*\).*|\1|p' | head -1)
              check_ref "pooza/$r の release.yml の release-tag" "$ref" || bad=1
            fi
          done

          # ⚠ warning は流れて消える。ジョブサマリに残して、週次で一覧が読める形にする。
          echo "## ginseng-style の固定状況" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "最新タグ: \`$latest\` (\`$latest_sha\`) / 古い・未移行の参照: $stale 件" >> "$GITHUB_STEP_SUMMARY"

          exit $bad

  # ⚠⚠ #65 で gem 側 7 本のタグを `workflow_dispatch` 契機にした。押すのは人なので、
  # **押し忘れは自動では直らない**。⚠ これは仮定ではない — 2026-08-27 時点で
  # `ginseng-core` は version 1.22.0 に対しタグが v1.20.0（security 修正 #580 / #582
  # が未出荷）、`ginseng-web` は 3 版、`ginseng-redis` は 2 版遅れ、`ginseng-piefed`
  # はタグが 1 本も無かった。**見張らないと誰も気付かない。**
  releases:
    runs-on: ubuntu-latest
    steps:
      - name: check whether v<version> is tagged
        env:
          GH_TOKEN: ${{ secrets.GEM_WATCH_TOKEN }}
        run: |
          set -uo pipefail

          echo "## 出荷の滞留（\`v<version>\` が打たれているか）" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| gem | version | 出荷 | 基点のタグ | 基点以降 |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- | --- | --- | --- |" >> "$GITHUB_STEP_SUMMARY"

          bad=0
          for r in $GEMS; do
            version=$(gh api -H 'Accept: application/vnd.github.raw' \
                        "repos/pooza/$r/contents/config/lib.yaml" 2>/dev/null \
                      | ruby -ryaml -e 'puts (YAML.safe_load($stdin.read)["package"] || {})["version"]' 2>/dev/null)
            if [ -z "$version" ]; then
              # ⚠⚠ version が読めないのは「ずれている」より重い。タグの正本そのものが
              # 無いということなので、release-tag が動きようがない。
              echo "::error::pooza/$r の config/lib.yaml から package.version を読めない"
              echo "| \`$r\` | 🔴 読めない | - | - | - |" >> "$GITHUB_STEP_SUMMARY"
              bad=1
              continue
            fi

            # ⚠⚠ **`set -e` が無いので、失敗しても止まらない。** 取得に失敗したのを
            # 「タグが 1 本も無い」と読むと、**滞留を見張るジョブが見張らないまま
            # 緑で終わる**（Codex P2）。取得の成否を先に確かめる。
            if ! tags=$(gh api "repos/pooza/$r/tags" --paginate --jq '.[].name' 2>&1); then
              echo "::error::pooza/$r のタグ一覧を取得できない: $(printf '%s' "$tags" | head -1)"
              echo "| \`$r\` | $version | 🔴 取得できない | - | - |" >> "$GITHUB_STEP_SUMMARY"
              bad=1
              continue
            fi
            semver=$(printf '%s\n' "$tags" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$')

            if [ -z "$semver" ]; then
              # ⚠ 落とさない。alpha の gem はまだ利用側を持たないことがある。
              echo "::warning::pooza/$r にタグが 1 本も無い（version は $version）"
              echo "| \`$r\` | $version | ⚠ 未 | なし | - |" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi

            # ⚠⚠ **問うのは「\`v\$version\` が在るか」。** release-tag が見ているのと同じ問い。
            #    「最大のタグと一致するか」で問うと、**版の系列を戻したリポジトリで嘘をつく**
            #    （#72。ginseng-web は v1.4.x を打ち捨てて 1.3.x に戻している）。
            if printf '%s\n' "$semver" | grep -Fqx "v$version"; then
              ahead=$(gh api "repos/pooza/$r/compare/v$version...main" --jq '.ahead_by' 2>/dev/null || echo '?')
              echo "ok       pooza/$r  v$version"
              echo "| \`$r\` | $version | ✅ | \`v$version\` | $ahead |" >> "$GITHUB_STEP_SUMMARY"
            else
              # ⚠⚠ 滞留の量を測る基点は「**version 以下で最大の**タグ」。最大のタグでは
              #    ない — 捨てた枝を指すと、距離が滞留の量を表さなくなる。
              #    v$version を混ぜて並べ、その直前を採る（v$version は必ず在る）。
              base=$(printf '%s\nv%s\n' "$semver" "$version" \
                     | sort -V -u \
                     | awk -v v="v$version" '$0 == v {exit} {last = $0} END {print last}')
              if [ -n "$base" ]; then
                ahead=$(gh api "repos/pooza/$r/compare/$base...main" --jq '.ahead_by' 2>/dev/null || echo '?')
              else
                # version 以下のタグが 1 本も無い（系列を上げ直した直後など）。
                base='なし'
                ahead='-'
              fi
              # ⚠ 赤にしない。**着手時バンプをする以上、ずれている期間は必ずある**
              # （docs/workflow.md）。ここで赤くすると「赤は無視するもの」になる。
              echo "::warning::pooza/$r は v$version が未出荷（基点 $base から $ahead コミット）"
              echo "| \`$r\` | $version | 🟡 未 | \`$base\` | $ahead |" >> "$GITHUB_STEP_SUMMARY"
            fi

            # ⚠⚠ **系列を戻した痕跡は、それ自体が知りたい。** 判定からは外したが黙らせない。
            highest=$(printf '%s\n' "$semver" | sort -V | tail -1)
            if [ "$highest" != "v$version" ] \
               && [ "$(printf '%s\nv%s\n' "$highest" "$version" | sort -V | tail -1)" = "$highest" ]; then
              echo "::warning::pooza/$r は最大のタグ $highest が version $version より大きい（版の系列を戻した痕跡）"
            fi
          done

          exit $bad
