name: release

# ⚠⚠ 手順の正本は composite action 側（.github/actions/release-tag）。**7 gem からも
# 同じものを `@vX.Y.Z` で呼ぶ**ので、ここは薄いままにする（#65。test.yml が
# ruby-check でそうしているのと同じ形）。
#
# ⚠ このリポジトリは mode: auto。**バンプ＝リリース**なので、着手時にバンプしない
# （docs/workflow.md の例外規定）。⚠⚠ gem 側 7 本は mode: manual。

on:
  push:
    branches:
      - main
  workflow_dispatch:

# ⚠⚠ タグを作るので書き込みが要る。このリポジトリの既定 workflow 権限は read
# なので、**ここでの宣言が効くかどうかがこの workflow の実測点でもある**。
permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # ⚠⚠ 「配布物を変えたのに version を上げていない」の判定は**タグとの差分**で
          # 見る。浅いチェックアウトではタグにも履歴にも届かない。
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/release-tag
        with:
          mode: auto
          token: ${{ github.token }}
