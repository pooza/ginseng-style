# pooza の Ruby プロジェクト共通の RuboCop 設定。**ここが正本。**
#
# ⚠ **このファイルの変更は、inherit_gem している全プロジェクトに波及する。**
# 1 リポジトリで `bundle update ginseng-style && bundle exec rubocop` を通してから
# 配ること。`NewCops: enable` と各プロジェクトの `TargetRubyVersion` の組み合わせで、
# いま緑のものが赤くなりうる。
#
# 各プロジェクト側の `.rubocop.yml` は差分だけを書く:
#
#   inherit_gem:
#     ginseng-style: config/rubocop.yml
#   AllCops:
#     TargetRubyVersion: 4.0
#
# ⚠⚠ 継承先で `AllCops/Exclude` や `AllCops/Include` を書くと、**ここの配列を
# 置換する**（マージされない）。`Include: [bin/foo]` とだけ書いた時点で lint 対象が
# `bin/foo` だけになるが、⚠ **rubocop は「1 file inspected, no offenses」と出して
# 緑のまま通る。** 詳細と対処は README の「プロジェクト固有として残してよいもの」。
#
# 設定の「なぜ」は docs/ruby.md にある。cop を切った理由がコードの書き方の規約に
# なっている箇所（`Style/RedundantReturn` など）は、必ずそちらも読むこと。
plugins:
  - rubocop-minitest
  - rubocop-performance
  - rubocop-rake

AllCops:
  AllowSymlinksInCacheRootDirectory: true
  DisplayCopNames: true
  Exclude:
    - '**/._*'
    - '**/.git/**/*'
    - config/**/*
    - public/**/*
    - tmp/**/*
    - '**/old/**/*'
    # ⚠ CI は bundler-cache でここに gem を展開する。除外しないと、gem 側の
    # .rubocop.yml（rubocop-rspec を require する等）まで読みに行って落ちる。
    - vendor/**/*
  Include:
    - '**/*.rb'
    - '**/Rakefile'
    - '**/config.ru'
  NewCops: enable
  # ⚠ ここは**下限**。各プロジェクトが自分の値で上書きすること。
  TargetRubyVersion: 3.3
Layout/ArgumentAlignment:
  EnforcedStyle: with_fixed_indentation
Layout/ArrayAlignment:
  EnforcedStyle: with_fixed_indentation
Layout/EmptyLineAfterGuardClause:
  Enabled: false
# 見栄えのための位置揃えを検出する（インデントは論理構造だけを反映する方針）。
Layout/EndAlignment:
  EnforcedStyleAlignWith: variable
Layout/EndOfLine:
  EnforcedStyle: lf
Layout/FirstArgumentIndentation:
  EnforcedStyle: consistent
Layout/FirstArrayElementIndentation:
  EnforcedStyle: consistent
Layout/FirstHashElementIndentation:
  EnforcedStyle: consistent
Layout/LineContinuationLeadingSpace:
  EnforcedStyle: leading
Layout/LineEndStringConcatenationIndentation:
  EnforcedStyle: indented
Layout/LineLength:
  Exclude:
    - test/**/*
  Max: 100
# ⚠ この 2 つは `return` に多行のチェインを繋ぐと 4 スペースを要求してくる。
#   回避は「`return` に多行チェインを繋がない」で、cop を切らない。
#   理由は docs/ruby.md の「`return` に多行のチェインを繋がない」を読むこと。
Layout/MultilineMethodCallIndentation:
  EnforcedStyle: indented
Layout/MultilineOperationIndentation:
  EnforcedStyle: indented
Layout/ParameterAlignment:
  EnforcedStyle: with_fixed_indentation
Layout/SpaceBeforeBlockBraces:
  EnforcedStyle: space
Layout/SpaceInsideBlockBraces:
  EnforcedStyle: no_space
  EnforcedStyleForEmptyBraces: no_space
  SpaceBeforeBlockParameters: false
Layout/SpaceInsideHashLiteralBraces:
  EnforcedStyle: no_space
Lint/AssignmentInCondition:
  Enabled: false
Lint/UnusedMethodArgument:
  Enabled: false
# ⚠ 除外の glob は `test/*` ではなく `test/**/*`。`test/unit/...` のように
#   入れ子でテストを置くプロジェクトでは、`test/*` だと除外が効かない。
Metrics/AbcSize:
  Exclude:
    - test/**/*
  Max: 30
Metrics/BlockLength:
  Exclude:
    - test/**/*
    - '**/contract/*'
    - '**/controller/*'
    - app/task/**/*.rb
    - '*.gemspec'
    # マイグレーションは `Sequel.migration do ... end` が丸ごと 1 ブロックなので、
    # 行数で切ると意味の無い分割を強いることになる。
    - app/migration/**/*.rb
Metrics/ClassLength:
  Exclude:
    - test/**/*
    - '**/contract/*'
    - '**/controller/*'
    - '**/service/*'
  Max: 200
Metrics/CyclomaticComplexity:
  Exclude:
    - test/**/*
    - '**/contract/*'
  Max: 10
Metrics/MethodLength:
  Exclude:
    - test/**/*
  Max: 20
Metrics/ModuleLength:
  Exclude:
    - test/**/*
    - '**/contract/*'
    - '**/controller/*'
    - '**/service/*'
  Max: 200
Metrics/PerceivedComplexity:
  Exclude:
    - test/**/*
    - '**/contract/*'
  Max: 10
# ⚠⚠ ここのプロジェクトは minitest ではなく **test-unit** を使っている。
# 下の 4 つは、test-unit に存在しないメソッドへ言い換えさせる。適用すると
# `NoMethodError` になるが、⚠ **rubocop は緑のまま通るのでテストを実行するまで
# 気づけない。**（例: minitest は `assert_path_exists`、test-unit は
# `assert_path_exist` と単数形）
#
# ⚠ `assert_includes` や `assert_predicate` のように test-unit にもあるものは
# 問題ないので、rubocop-minitest 全体を切る必要はない。
#
# 🔴 実例: `Minitest/ReturnInTestMethod` が `return if ...` を `skip if ...` へ
# 自動修正し、あるリポジトリの CI が **1 年半以上テストで落ち続けていた**
# （2025-01-02 〜 2026-08-20）。⚠ lint は緑のままだった。docs/rationale.md 参照。
Minitest/AssertPathExists:
  Enabled: false
Minitest/RefutePathExists:
  Enabled: false
Minitest/AssertOutput:
  Enabled: false
Minitest/AssertSilent:
  Enabled: false
Minitest/MultipleAssertions:
  Enabled: false
Minitest/ReturnInTestMethod:
  Enabled: false
Minitest/TestFileName:
  Enabled: false
Naming/RescuedExceptionsVariableName:
  PreferredName: e
Rake:
  Exclude:
    - '*'
  Include:
    - Rakefile
    - '*.rake'
    - app/task/**/*.rb
Style/AsciiComments:
  Enabled: false
Style/ConditionalAssignment:
  Enabled: false
Style/Documentation:
  Enabled: false
Style/EmptyMethod:
  EnforcedStyle: expanded
Style/FormatString:
  EnforcedStyle: percent
Style/FormatStringToken:
  EnforcedStyle: template
# ⚠ gem 側でマジックコメントを要求したい場合は、そのリポジトリで true に上書きする
#   （`ginseng-core` がそうしている）。
Style/FrozenStringLiteralComment:
  Enabled: false
Style/IdenticalConditionalBranches:
  Exclude:
    - test/**/*
Style/IfUnlessModifier:
  Exclude:
    - test/**/*
# 暗黙の return を使わない方針と衝突するため無効化する。docs/ruby.md 参照。
Style/RedundantReturn:
  Enabled: false
Style/RescueModifier:
  Enabled: false
Style/RescueStandardError:
  Enabled: false
Style/StringLiterals:
  EnforcedStyle: single_quotes
Style/SymbolArray:
  EnforcedStyle: brackets
Style/TrailingCommaInArguments:
  EnforcedStyleForMultiline: comma
Style/TrailingCommaInArrayLiteral:
  EnforcedStyleForMultiline: comma
Style/TrailingCommaInHashLiteral:
  EnforcedStyleForMultiline: comma
Style/WordArray:
  EnforcedStyle: brackets
Style/YodaCondition:
  Enabled: false
